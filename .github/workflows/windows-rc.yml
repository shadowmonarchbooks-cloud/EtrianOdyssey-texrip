name: Windows release candidate

on:
  push:
    branches:
      - 'milestone/0.60-untold-parity'
    paths:
      - 'Cargo.toml'
      - 'crates/eo-extract/**'
      - 'crates/eo-untold/**'
      - 'app/desktop/**'
      - '.github/workflows/windows-rc.yml'

permissions:
  contents: write

jobs:
  build-windows-rc:
    name: Build Windows RC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - name: Test reusable extraction layer
        run: cargo test -p eo-extract --all-targets

      - name: Build desktop app
        run: cargo build --release -p eo-texrip-desktop --bin EO-TexRip

      - name: Package RC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.60.0-rc.2'
          $folderName = "EO-TexRip-$version-windows-x64"
          $stage = Join-Path 'dist' $folderName
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'target\release\EO-TexRip.exe' (Join-Path $stage 'EO-TexRip.exe')
          Copy-Item 'app\desktop\RELEASE_CANDIDATE.md' (Join-Path $stage 'README.txt')
          Copy-Item 'THIRD_PARTY.md' (Join-Path $stage 'THIRD_PARTY.txt')
          $zip = Join-Path 'dist' "$folderName.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $folderName.zip" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Upload RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: EO-TexRip-0.60.0-rc.2-windows-x64
          path: |
            dist/EO-TexRip-0.60.0-rc.2-windows-x64.zip
            dist/EO-TexRip-0.60.0-rc.2-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event.head_commit.message == 'Release 0.60.0-rc.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.60.0-rc.2'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag -y
          }
          gh release create $tag `
            'dist\EO-TexRip-0.60.0-rc.2-windows-x64.zip' `
            'dist\EO-TexRip-0.60.0-rc.2-windows-x64.zip.sha256' `
            --target $env:GITHUB_SHA `
            --title 'EO-TexRip 0.60.0-rc.2' `
            --prerelease `
            --notes-file 'app\desktop\RELEASE_CANDIDATE.md'
