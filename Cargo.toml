[workspace]
resolver = "2"
members = [
    "crates/eo-core",
    "crates/eo-profiles",
    "crates/eo-catalog",
    "crates/eo-project",
    "crates/eo-rom",
    "crates/eo-archives",
    "crates/eo-textures",
    "crates/eo-models",
    "crates/eo-azahar",
]
default-members = [
    "crates/eo-core",
    "crates/eo-profiles",
    "crates/eo-catalog",
    "crates/eo-project",
    "crates/eo-rom",
    "crates/eo-archives",
    "crates/eo-textures",
    "crates/eo-models",
    "crates/eo-azahar",
]

[workspace.package]
version = "0.50.0"
edition = "2021"
rust-version = "1.82"
authors = ["EO-TexRip contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
