[workspace]
resolver = "2"
members = [
    "crates/eo-core",
    "crates/eo-profiles",
    "crates/eo-catalog",
]
default-members = [
    "crates/eo-core",
    "crates/eo-profiles",
    "crates/eo-catalog",
]

[workspace.package]
version = "0.20.0"
edition = "2021"
rust-version = "1.82"
authors = ["EO-TexRip contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
